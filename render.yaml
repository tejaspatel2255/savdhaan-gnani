services:
  - type: web
    name: savdhaan
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: GNANI_API_KEY
        sync: false        # Set this manually in the Render dashboard (keep it secret)
      - key: DEMO
        value: "0"
      - key: ALLOWED_ORIGINS
        sync: false        # After first deploy, set to your Render URL e.g. https://savdhaan.onrender.com
      - key: MAX_TTS_CHARS_PER_RUN
        value: "600"
      - key: MAX_STT_SECONDS_PER_RUN
        value: "180"
      - key: SAVE_LIVE_RUNS
        value: "false"
